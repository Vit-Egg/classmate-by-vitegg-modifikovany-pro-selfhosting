# Produkční nasazení: aplikace + Caddy (automatické HTTPS od Let's Encrypt).
# Spuštění: cp .env.production.example .env && docker compose up -d --build
name: classmate
services:
  app:
    # Hotový obraz z GitHubu (docker compose pull). Když ho nemáš, sestaví se lokálně (--build).
    image: classmate-selfhost-full:latest
    build:
      context: .
      args:
        LOW_MEMORY: ${LOW_MEMORY:-0}
    restart: unless-stopped
    stop_grace_period: 30s # kolaborativní poznámky a otevřené zápisy se při vypnutí stihnou uložit
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      APP_SECRET: ${APP_SECRET:?Nastav APP_SECRET v .env}
      NODE_OPTIONS: --max-old-space-size=${NODE_HEAP_MB:-1024}
      DATA_DIR: /data
      COOKIE_SECURE: "true"
      PUBLIC_URL: ${PUBLIC_URL:-}
      EMBED_ORIGINS: ${EMBED_ORIGINS:-}
      BACKGROUND_SYNC_MINUTES: ${BACKGROUND_SYNC_MINUTES:-5}
      BACKGROUND_SYNC_PARALLEL: ${BACKGROUND_SYNC_PARALLEL:-8}
      BAKALARI_CONCURRENCY: ${BAKALARI_CONCURRENCY:-6}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      DISK_MIN_FREE_MB: ${DISK_MIN_FREE_MB:-1024}
      FFMPEG_CONCURRENCY: ${FFMPEG_CONCURRENCY:-2}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-6}
      PUSH_QUIET_HOURS: ${PUSH_QUIET_HOURS:-22-6}
      AUDIO_QUOTA_MB: ${AUDIO_QUOTA_MB:-2048}
      IMAGE_QUOTA_MB: ${IMAGE_QUOTA_MB:-500}
      FILE_QUOTA_MB: ${FILE_QUOTA_MB:-1024}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      ANALYTICS_SRC: ${ANALYTICS_SRC:-}
      ANALYTICS_WEBSITE_ID: ${ANALYTICS_WEBSITE_ID:-}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ANDROID_APP_CERTS: ${ANDROID_APP_CERTS:-}
      ANDROID_APP_PACKAGE: ${ANDROID_APP_PACKAGE:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      FEEDBACK_EMAIL: ${FEEDBACK_EMAIL:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_URL: ${OPERATOR_URL:-}
      STRIPE_PASS_FEE: ${STRIPE_PASS_FEE:-1}
      STRIPE_FEE_PERCENT: ${STRIPE_FEE_PERCENT:-1.5}
      STRIPE_FEE_FIXED_CZK: ${STRIPE_FEE_FIXED_CZK:-6.5}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      TODOIST_CLIENT_ID: ${TODOIST_CLIENT_ID:-}
      TODOIST_CLIENT_SECRET: ${TODOIST_CLIENT_SECRET:-}
    volumes:
      - classmate-data:/data
    expose:
      - "3000"
    init: true # správný PID 1: zombie procesy (ffmpeg) se uklidí a SIGTERM dojde do aplikace
    # strop paměti kontejneru: při úniku paměti se restartuje jen aplikace, ne celý stroj. Node dostane o něco míň (NODE_HEAP_MB), zbytek je pro ffmpeg a nativní paměť.
    mem_limit: ${APP_MEMORY:-1536m}
    pids_limit: 512
    ulimits:
      nofile: { soft: 65536, hard: 65536 } # spojení uživatelů, soubory a spolupráce na poznámkách
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Nastav DOMAIN v .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  classmate-data:
    name: classmate-data
  caddy-data:
  caddy-config:
